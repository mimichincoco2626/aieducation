<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI x 教育 | 親子天下雙週報策展</title>
    
    <!-- 1. 錯誤處理與環境設定 (優先執行) -->
    <script>
        // 設定全域環境變數，防止 React 在某些情況下報錯
        window.process = { env: { NODE_ENV: 'production' } };

        // 全域錯誤攔截器：如果畫面空白，會顯示錯誤訊息
        window.onerror = function(message, source, lineno, colno, error) {
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = `
                    <div style="padding: 20px; color: #7f1d1d; background: #fef2f2; border: 1px solid #f87171; border-radius: 8px; margin: 20px; font-family: monospace;">
                        <h3 style="font-weight: bold; margin-bottom: 10px;">⚠️ 網頁載入發生錯誤</h3>
                        <p><strong>錯誤訊息：</strong> ${message}</p>
                        <p><strong>位置：</strong> Line ${lineno}, Column ${colno}</p>
                        <p style="margin-top: 10px; font-size: 12px; color: #991b1b;">請將此畫面截圖提供給開發人員以進行修復。</p>
                    </div>
                `;
            }
        };
    </script>

    <!-- 2. 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- 3. 模組對應表 (Import Map) -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.263.1"
            }
        }
    </script>
    
    <!-- 4. 引入 Babel (鎖定版本) -->
    <script src="https://unpkg.com/@babel/standalone@7.24.5/babel.min.js"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .text-shadow { text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .text-shadow-sm { text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <!-- 應用程式掛載點 -->
    <div id="root">
        <!-- 預設顯示載入畫面，避免 React 啟動前的短暫空白 -->
        <div class="min-h-screen flex items-center justify-center text-slate-400">
            <div class="animate-pulse flex flex-col items-center">
                <div class="h-8 w-8 bg-slate-300 rounded-full mb-4"></div>
                <div class="text-sm">系統載入中...</div>
            </div>
        </div>
    </div>

    <!-- 5. React 應用程式邏輯 -->
    <!-- 注意：這裡移除了 'env' preset，只保留 'react'，避免 require 錯誤 -->
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Search, BookOpen, ExternalLink, Filter, Calendar, Tag, RefreshCw, 
            Layers, User, AlertCircle, Bug, CheckCircle, XCircle, Crown, 
            ArrowRight, Star, Mail, FileText, PenTool 
        } from 'lucide-react';

        // --- 設定區 ---
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxwao8aHQ3hCkxYj5MndNs6ObaPy4fphHr-WCdt-cCEK9uRpTaOomHJcTqNZKiMOxg7/exec";
        const HEADER_IMAGE_URL = ""; 

        const COLUMN_MAPPING = {
            title: "Title",       
            category1: "Category1", 
            category2: "Category2", 
            summary: "Summary",   
            link: "Link",         
            image: "Image",       
            date: "Date",         
            author: "Author"      
        };

        const FEATURED_TAG = "主編精選";
        const SUBMISSION_TAG = "讀者投書";

        const MOCK_DATA = [
            {
                id: 1,
                title: "AI 在 K-12 教育中的應用指南",
                categories: ["教學實務", "政策規範", "主編精選"], 
                primaryCategories: ["教學實務"],
                summary: "這是一筆範例資料。如果您看到這張卡片，代表程式還沒讀取到您的 Google Sheet 資料，或是讀取失敗。",
                link: "#",
                date: "2024-01-15",
                image: "https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&q=80&w=800",
                author: "範例作者"
            },
            {
                id: 2,
                title: "一般文章範例",
                categories: ["工具評測"],
                primaryCategories: ["工具評測"],
                summary: "這是一般文章，會顯示在下方的格狀列表中。",
                link: "#",
                date: "2024-01-20",
                image: null,
                author: "測試人員"
            },
            {
                id: 3,
                title: "輪播測試範例",
                categories: ["趨勢觀點", "主編精選"],
                primaryCategories: ["趨勢觀點"],
                summary: "這是第二篇主編精選，用來測試輪播效果是否正常運作。",
                link: "#",
                date: "2024-01-25",
                image: "https://images.unsplash.com/photo-1488190211105-8b0e65b80b4e?auto=format&fit=crop&q=80&w=800",
                author: "測試人員"
            }
        ];

        // 骨架屏組件
        const SkeletonCard = () => (
            <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden h-full flex flex-col">
                <div className="h-44 bg-slate-200 animate-pulse"></div>
                <div className="p-5 flex flex-col gap-4 flex-grow">
                    <div className="h-7 bg-slate-200 rounded animate-pulse w-3/4"></div>
                    <div className="space-y-2 flex-grow">
                        <div className="h-4 bg-slate-200 rounded animate-pulse w-full"></div>
                        <div className="h-4 bg-slate-200 rounded animate-pulse w-full"></div>
                        <div className="h-4 bg-slate-200 rounded animate-pulse w-2/3"></div>
                    </div>
                    <div className="pt-4 border-t border-slate-100 flex justify-between items-center mt-auto">
                        <div className="h-4 bg-slate-200 rounded animate-pulse w-1/3"></div>
                        <div className="h-4 bg-slate-200 rounded animate-pulse w-1/4"></div>
                    </div>
                </div>
            </div>
        );

        const SkeletonHero = () => (
            <div className="mb-10 md:mb-12 relative bg-slate-200 rounded-3xl overflow-hidden shadow-sm h-[400px] animate-pulse">
                <div className="absolute inset-0 bg-gradient-to-r from-slate-300 to-slate-200"></div>
            </div>
        );

        function App() {
            const [articles, setArticles] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [searchTerm, setSearchTerm] = useState("");
            const [selectedCategory, setSelectedCategory] = useState("All");
            const [dataSource, setDataSource] = useState("mock");
            const [showDebug, setShowDebug] = useState(false);
            const [lastUpdated, setLastUpdated] = useState(null);
            const [heroIndex, setHeroIndex] = useState(0);

            // 錯誤邊界 (簡單版)
            const [hasError, setHasError] = useState(false);

            const processImageUrl = (url) => {
                if (!url) return null;
                let cleanUrl = String(url).trim();
                if (cleanUrl.includes('drive.google.com')) {
                    let id = null;
                    const parts = cleanUrl.match(/\/d\/(.*?)(?:\/|$)/);
                    if (parts && parts[1]) id = parts[1];
                    else {
                        try {
                            const urlObj = new URL(cleanUrl);
                            const idParam = urlObj.searchParams.get("id");
                            if (idParam) id = idParam;
                        } catch (e) { console.log("URL parse error", e); }
                    }
                    if (id) return `https://drive.google.com/uc?export=view&id=${id}`;
                }
                return cleanUrl;
            };

            const fetchData = async () => {
                if (!APPS_SCRIPT_URL) {
                    setArticles(MOCK_DATA);
                    setDataSource("mock");
                    return;
                }
                setLoading(true);
                setError(null);
                try {
                    const response = await fetch(APPS_SCRIPT_URL);
                    if (!response.ok) throw new Error(`連線失敗: ${response.status}`);
                    const data = await response.json();
                    if (!Array.isArray(data)) throw new Error("回傳格式錯誤，預期為陣列");

                    const formattedArticles = data.map((item, index) => {
                        const title = item[COLUMN_MAPPING.title];
                        if (!title) return null;
                        
                        // 處理 Category1
                        let primaryList = [];
                        const cat1 = item[COLUMN_MAPPING.category1];
                        if (cat1) primaryList = String(cat1).split(/[,，]/).map(c => c.trim()).filter(c => c.length > 0);

                        // 處理 Category2
                        let secondaryList = [];
                        const cat2 = item[COLUMN_MAPPING.category2];
                        if (cat2) secondaryList = String(cat2).split(/[,，]/).map(c => c.trim()).filter(c => c.length > 0);
                        
                        let fullList = [...primaryList, ...secondaryList];
                        fullList = [...new Set(fullList)];
                        if (fullList.length === 0) fullList = ["未分類"];

                        const processedImage = processImageUrl(item[COLUMN_MAPPING.image]);

                        return {
                            id: index,
                            title: title,
                            categories: fullList,
                            primaryCategories: primaryList,
                            summary: item[COLUMN_MAPPING.summary] || "",
                            link: item[COLUMN_MAPPING.link] || "#",
                            image: processedImage,
                            rawImage: item[COLUMN_MAPPING.image], 
                            date: item[COLUMN_MAPPING.date] ? String(item[COLUMN_MAPPING.date]) : "",
                            author: item[COLUMN_MAPPING.author] || ""
                        };
                    }).filter(item => item !== null);

                    setArticles(formattedArticles);
                    setDataSource("api");
                    setLastUpdated(new Date().toLocaleTimeString());
                } catch (err) {
                    console.error("Fetch Error:", err);
                    setError(err.message || "發生未知錯誤");
                    setArticles(MOCK_DATA);
                    setDataSource("mock");
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { fetchData(); }, []);

            const { featuredArticles, regularArticles } = useMemo(() => {
                const featured = [];
                const regular = [];
                articles.forEach(article => {
                    if (article.categories.includes(FEATURED_TAG)) featured.push(article);
                    else regular.push(article);
                });
                return { featuredArticles: featured, regularArticles: regular };
            }, [articles]);

            useEffect(() => {
                if (featuredArticles.length <= 1) return;
                const interval = setInterval(() => {
                    setHeroIndex((prev) => (prev + 1) % featuredArticles.length);
                }, 8000); 
                return () => clearInterval(interval);
            }, [featuredArticles]);

            const categories = useMemo(() => {
                if (loading && articles.length === 0) return ["All", "載入中..."];
                const primaryCats = articles.flatMap(a => a.primaryCategories);
                const uniqueCats = new Set(primaryCats);
                uniqueCats.delete(FEATURED_TAG);
                uniqueCats.add(SUBMISSION_TAG);
                return ["All", ...Array.from(uniqueCats).sort()];
            }, [articles, loading]);

            const filteredArticles = useMemo(() => {
                const sourceList = searchTerm ? articles : regularArticles;
                return sourceList.filter(article => {
                    const searchContent = (
                        article.title + article.summary + 
                        article.categories.join(" ") + article.author
                    ).toLowerCase();
                    return searchContent.includes(searchTerm.toLowerCase()) && 
                        (selectedCategory === "All" || article.categories.includes(selectedCategory));
                });
            }, [articles, regularArticles, searchTerm, selectedCategory]);

            const heroArticle = featuredArticles.length > 0 ? featuredArticles[heroIndex] : null;

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 pb-20">
                    <header className="relative border-b border-indigo-900/10 shadow-lg sticky top-0 z-20 overflow-hidden">
                        <div className="absolute inset-0 bg-gradient-to-r from-[#2A2F75] via-[#6B4D9E] to-[#E56B8B]"></div>
                        <div className="absolute top-0 right-0 w-64 h-64 bg-white/10 blur-[60px] rounded-full pointer-events-none -translate-y-1/2 translate-x-1/2"></div>
                        <div className="absolute bottom-0 left-0 w-48 h-48 bg-blue-500/20 blur-[40px] rounded-full pointer-events-none translate-y-1/2 -translate-x-1/2"></div>
                        {HEADER_IMAGE_URL && (
                            <div className="absolute inset-0 z-0">
                                <img src={HEADER_IMAGE_URL} alt="Header" className="w-full h-full object-cover" />
                                <div className="absolute inset-0 bg-black/20"></div>
                            </div>
                        )}
                        <div className="relative z-10 max-w-6xl mx-auto px-4 py-4 md:py-5 flex flex-col md:flex-row items-center justify-between gap-4 md:gap-6">
                            <div className="flex items-start gap-4 text-white w-full md:w-auto">
                                {!HEADER_IMAGE_URL && (
                                    <div className="hidden md:flex flex-col items-center justify-center pt-1">
                                        <div className="text-4xl font-bold leading-none tracking-tighter">AI<span className="text-pink-300 mx-1">×</span>教育</div>
                                        <div className="w-full h-[1px] bg-white/30 mt-1 mb-1 transform -rotate-1"></div>
                                        <div className="text-[10px] tracking-widest opacity-80">BIWEEKLY NEWSLETTER</div>
                                    </div>
                                )}
                                <div className={`${HEADER_IMAGE_URL ? 'bg-black/40 backdrop-blur-md p-4 rounded-xl' : ''} flex-1 md:flex-none`}>
                                    {!HEADER_IMAGE_URL && (
                                        <h1 className="md:hidden text-2xl font-bold tracking-tight mb-1 flex items-center">
                                            AI<span className="text-pink-300 mx-1">×</span>教育
                                        </h1>
                                    )}
                                    <div className="flex flex-col gap-1">
                                        <p className="text-sm md:text-base font-medium text-white/95 text-shadow">陪你看懂 AI 時代的教育與學習：</p>
                                        <p className="text-sm md:text-base font-medium text-white/95 text-shadow">AI 改變了什麼？我們可以怎麼因應？</p>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-3 w-full md:w-auto">
                                <div className="relative w-full md:w-64 group">
                                    <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-white/60 group-hover:text-white transition-colors" size={16} />
                                    <input type="text" placeholder="搜尋文章..." className="w-full pl-9 pr-4 py-2 bg-white/10 border border-white/20 rounded-lg text-sm text-white placeholder-white/50 focus:bg-white/20 focus:border-white/40 focus:outline-none transition-all backdrop-blur-sm" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                                </div>
                                <button onClick={fetchData} className="flex items-center gap-2 px-3 py-2 text-white/80 hover:text-white hover:bg-white/10 active:bg-white/20 active:scale-95 rounded-lg transition-all text-sm font-medium backdrop-blur-sm border border-transparent hover:border-white/10" title="重新整理資料">
                                    <RefreshCw size={16} className={loading ? "animate-spin" : ""} />
                                    <span className="hidden md:inline">{loading ? "讀取中" : "更新"}</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-6 md:py-8">
                        {loading && articles.length === 0 ? (
                            <div className="animate-fade-in">
                                <SkeletonHero />
                                <div className="mb-8 flex gap-4 overflow-hidden">
                                    {[1,2,3,4].map(i => <div key={i} className="h-8 w-24 bg-slate-200 rounded-full animate-pulse"></div>)}
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {[1, 2, 3, 4, 5, 6].map((n) => <SkeletonCard key={n} />)}
                                </div>
                            </div>
                        ) : (
                            <>
                                {!searchTerm && heroArticle && (
                                    <div className="mb-10 md:mb-12 animate-fade-in">
                                        <div key={heroArticle.id} className="relative bg-[#2A2F75] rounded-3xl overflow-hidden shadow-2xl shadow-indigo-200 group transform transition-all animate-fade-in">
                                            <div className="absolute inset-0 bg-gradient-to-br from-[#2A2F75] to-[#4c2a75] z-0"></div>
                                            <div className="absolute top-0 right-0 w-[500px] h-[500px] bg-pink-500/20 blur-[100px] rounded-full pointer-events-none translate-x-1/3 -translate-y-1/3"></div>
                                            <div className="relative z-10 flex flex-col md:flex-row h-full min-h-[auto] md:min-h-[400px]">
                                                <div className="w-full md:w-[55%] relative h-56 md:h-auto overflow-hidden">
                                                    {heroArticle.image ? (
                                                        <img src={heroArticle.image} alt={heroArticle.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out" onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }} />
                                                    ) : null}
                                                    <div className={`w-full h-full absolute inset-0 bg-slate-800 flex items-center justify-center ${heroArticle.image ? 'hidden' : 'flex'}`}>
                                                        <Layers className="text-white/20" size={64} />
                                                    </div>
                                                    <div className="absolute inset-0 bg-gradient-to-t md:bg-gradient-to-r from-transparent via-[#2A2F75]/20 to-[#2A2F75] md:via-[#2A2F75]/50 md:to-[#2A2F75]"></div>
                                                </div>
                                                <div className="w-full md:w-[45%] p-6 md:p-12 flex flex-col justify-center text-white relative">
                                                    <div className="flex flex-wrap items-center gap-2 mb-3 md:mb-4">
                                                        <span className="flex items-center gap-1 bg-yellow-400 text-[#2A2F75] px-3 py-1 rounded-full text-xs font-black tracking-wider shadow-lg shadow-yellow-400/20"><Crown size={14} fill="currentColor" /> EDITOR'S CHOICE</span>
                                                        {heroArticle.categories.filter(c => c !== FEATURED_TAG).map(cat => <span key={cat} className="text-white/70 text-xs font-medium border border-white/20 px-2 py-0.5 rounded-full">{cat}</span>)}
                                                    </div>
                                                    <h2 className="text-xl md:text-4xl font-bold leading-tight mb-3 md:mb-4 text-shadow-sm group-hover:text-pink-200 transition-colors">{heroArticle.title}</h2>
                                                    <p className="text-indigo-100/80 text-sm md:text-base mb-6 md:mb-8 line-clamp-3 leading-relaxed">{heroArticle.summary}</p>
                                                    <div className="mt-auto flex items-center justify-between border-t border-white/10 pt-4 md:pt-6">
                                                        <div className="flex items-center gap-2">
                                                            {heroArticle.author && (<div className="flex items-center gap-2"><div className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white"><User size={14} /></div><div className="flex flex-col"><span className="text-xs text-white/60">Author</span><span className="text-xs font-medium">{heroArticle.author}</span></div></div>)}
                                                        </div>
                                                        <a href={heroArticle.link} target="_blank" rel="noopener noreferrer" className="group/btn flex items-center gap-2 bg-white text-[#2A2F75] px-5 py-2 md:px-6 md:py-3 rounded-xl font-bold hover:bg-pink-50 active:scale-95 transition-all shadow-lg hover:shadow-xl hover:shadow-white/10">閱讀 <ArrowRight size={16} className="group-hover/btn:translate-x-1 transition-transform" /></a>
                                                    </div>
                                                    {featuredArticles.length > 1 && (
                                                        <div className="absolute bottom-4 right-6 md:bottom-6 md:right-12 flex gap-2">
                                                            {featuredArticles.map((_, idx) => (
                                                                <button key={idx} onClick={() => setHeroIndex(idx)} className={`w-2 h-2 rounded-full transition-all duration-300 ${idx === heroIndex ? 'bg-white w-6' : 'bg-white/30 hover:bg-white/60'}`} aria-label={`Go to slide ${idx + 1}`} />
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide -mx-4 px-4 md:mx-0 md:px-0">
                                        {categories.map(cat => (
                                            <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all active:scale-95 ${selectedCategory === cat ? 'bg-gradient-to-r from-[#6B4D9E] to-[#C0568B] text-white shadow-md shadow-pink-200 border border-transparent' : 'bg-white text-slate-600 border border-slate-200 hover:border-pink-300 hover:text-[#C0568B]'}`}>{cat}</button>
                                        ))}
                                    </div>
                                    <div className="flex items-center gap-3 self-start md:self-auto">
                                        {dataSource === 'api' && (
                                            <div className="flex items-center gap-2 text-xs text-[#6B4D9E] bg-purple-50 px-3 py-1 rounded-full border border-purple-100">
                                                <span className="relative flex h-2 w-2"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span><span className="relative inline-flex rounded-full h-2 w-2 bg-purple-500"></span></span>
                                                <span>24小時持續更新 {lastUpdated && `(${lastUpdated})`}</span>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredArticles.map((article) => (
                                        <a key={article.id} href={article.link} target="_blank" rel="noopener noreferrer" className="group bg-white rounded-2xl border border-slate-200 overflow-hidden hover:shadow-xl hover:shadow-purple-200/50 hover:-translate-y-1 active:scale-[0.98] transition-all duration-300 flex flex-col h-full">
                                            <div className="h-44 bg-slate-100 relative overflow-hidden group-hover:opacity-100">
                                                {article.image ? <img src={article.image} alt={article.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }} /> : null}
                                                <div className={`w-full h-full absolute top-0 left-0 bg-gradient-to-br from-slate-100 to-slate-200 flex flex-col items-center justify-center text-slate-400 ${article.image ? 'hidden' : 'flex'}`}>
                                                    <Layers className="mb-2" size={32} />
                                                    {article.image ? <span className="text-[10px] flex items-center gap-1"><AlertCircle size={10} /> 圖片讀取失敗</span> : <span className="text-[10px] text-slate-300">無圖片</span>}
                                                </div>
                                                <div className="absolute top-3 left-3 flex flex-wrap gap-1 max-w-[90%]">
                                                    {article.categories.filter(c => c !== FEATURED_TAG).map((cat, idx) => (
                                                        <span key={idx} className="px-2 py-1 bg-white/95 backdrop-blur-sm text-xs font-bold text-[#6B4D9E] rounded-md shadow-sm">{cat}</span>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="p-5 flex flex-col flex-grow">
                                                <h3 className="text-lg font-bold text-slate-800 mb-2 line-clamp-2 leading-snug group-hover:text-[#C0568B] transition-colors">{article.title}</h3>
                                                <p className="text-slate-500 text-sm mb-4 line-clamp-3 flex-grow">{article.summary}</p>
                                                {article.author && <div className="flex items-center gap-1.5 text-xs text-slate-500 font-medium mb-3"><User size={12} className="text-slate-400" /><span>{article.author}</span></div>}
                                                <div className="pt-4 border-t border-slate-100 flex items-center justify-between mt-auto">
                                                    <div className="flex items-center gap-2 text-xs text-slate-400"><Calendar size={12} />{article.date ? article.date.substring(0, 10) : "近期更新"}</div>
                                                    <div className="flex items-center gap-1 text-xs font-bold text-[#6B4D9E] group-hover:underline">閱讀全文 <ExternalLink size={12} /></div>
                                                </div>
                                            </div>
                                        </a>
                                    ))}
                                </div>

                                {!loading && filteredArticles.length === 0 && (
                                    <div className="text-center py-20 bg-white rounded-2xl border border-dashed border-slate-300">
                                        <h3 className="text-lg font-medium text-slate-600">找不到相關文章</h3>
                                        <button onClick={() => {setSearchTerm(""); setSelectedCategory("All");}} className="mt-4 px-4 py-2 bg-purple-50 text-[#6B4D9E] rounded-lg text-sm font-medium">清除篩選</button>
                                    </div>
                                )}
                            </>
                        )}
                    </main>

                    <section className="bg-slate-50 border-t border-slate-200">
                        <div className="max-w-6xl mx-auto px-4 py-12">
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                <a href="https://site.parenting.com.tw/topic/aieducationedm_wtledm_-1957" target="_blank" rel="noopener noreferrer" className="group flex flex-col items-center justify-center p-6 bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-lg hover:shadow-purple-100 hover:border-purple-300 active:scale-[0.98] transition-all duration-300 text-center">
                                    <div className="w-14 h-14 bg-purple-50 rounded-full flex items-center justify-center text-[#6B4D9E] mb-4 group-hover:scale-110 group-hover:bg-[#6B4D9E] group-hover:text-white transition-all duration-300"><Mail size={24} /></div>
                                    <h4 className="font-bold text-slate-800 text-lg mb-1 group-hover:text-[#6B4D9E] transition-colors">訂閱 AIx教育 雙週報</h4>
                                    <p className="text-sm text-slate-500">掌握最新 AI 教育趨勢與資源</p>
                                </a>
                                <a href="https://view.cw.com.tw/?vawpToken=MZTND6W672QELB2BE2CKXLMNLI.110051" target="_blank" rel="noopener noreferrer" className="group flex flex-col items-center justify-center p-6 bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-lg hover:shadow-purple-100 hover:border-purple-300 active:scale-[0.98] transition-all duration-300 text-center">
                                    <div className="w-14 h-14 bg-purple-50 rounded-full flex items-center justify-center text-[#6B4D9E] mb-4 group-hover:scale-110 group-hover:bg-[#6B4D9E] group-hover:text-white transition-all duration-300"><FileText size={24} /></div>
                                    <h4 className="font-bold text-slate-800 text-lg mb-1 group-hover:text-[#6B4D9E] transition-colors">預覽上一期內容</h4>
                                    <p className="text-sm text-slate-500">精彩專題與教學案例線上看</p>
                                </a>
                                <a href="https://premium.parenting.com.tw/info/more-757" target="_blank" rel="noopener noreferrer" className="group flex flex-col items-center justify-center p-6 bg-gradient-to-br from-[#fffbf0] to-white rounded-2xl border border-amber-200 shadow-sm hover:shadow-lg hover:shadow-amber-100 hover:border-amber-400 active:scale-[0.98] transition-all duration-300 text-center relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-16 h-16 bg-amber-400/10 rounded-bl-full -mr-8 -mt-8 pointer-events-none group-hover:bg-amber-400/20 transition-colors"></div>
                                    <div className="w-14 h-14 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 mb-4 group-hover:scale-110 group-hover:bg-amber-500 group-hover:text-white transition-all duration-300"><Crown size={24} /></div>
                                    <h4 className="font-bold text-slate-800 text-lg mb-1 group-hover:text-amber-600 transition-colors">加入 Premium 會員</h4>
                                    <p className="text-sm text-slate-500">暢讀親子天下深度專題報導</p>
                                </a>
                                <a href="mailto:cwpeditor@cw.com.tw" className="group flex flex-col items-center justify-center p-6 bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-lg hover:shadow-purple-100 hover:border-purple-300 active:scale-[0.98] transition-all duration-300 text-center">
                                    <div className="w-14 h-14 bg-purple-50 rounded-full flex items-center justify-center text-[#6B4D9E] mb-4 group-hover:scale-110 group-hover:bg-[#6B4D9E] group-hover:text-white transition-all duration-300"><PenTool size={24} /></div>
                                    <h4 className="font-bold text-slate-800 text-lg mb-1 group-hover:text-[#6B4D9E] transition-colors">讀者投書</h4>
                                    <p className="text-sm text-slate-500">歡迎投稿分享您的 AI 教學經驗</p>
                                </a>
                            </div>
                        </div>
                    </section>

                    <footer className="max-w-6xl mx-auto px-4 py-6 border-t border-slate-200 bg-white">
                        <div className="flex justify-center items-center gap-4">
                            <p className="text-slate-400 text-sm">© 2026 親子天下.</p>
                            <button onClick={() => setShowDebug(!showDebug)} className="flex items-center gap-1 text-xs text-slate-400 hover:text-[#6B4D9E] transition-colors bg-slate-100 px-2 py-1 rounded">
                                <Bug size={14} /> {showDebug ? "關閉檢測" : "資料檢測"}
                            </button>
                        </div>
                        {showDebug && (
                            <div className="mt-4 p-4 bg-slate-900 text-slate-200 rounded-xl text-xs font-mono overflow-x-auto shadow-2xl">
                                <h4 className="text-emerald-400 font-bold mb-2 text-sm border-b border-slate-700 pb-2 flex justify-between">
                                    <span>🛠️ 連結診斷 (前 3 筆)</span>
                                    <span className="text-slate-500">此面板僅供除錯</span>
                                </h4>
                                {articles.length > 0 ? (
                                    <div className="space-y-4">
                                        {articles.slice(0, 3).map((item, idx) => (
                                            <div key={idx} className="border-b border-slate-800 pb-3 mb-3 last:border-0">
                                                <div className="text-white font-bold mb-1 flex items-center gap-2">
                                                    <span className="text-indigo-400">#{idx + 1}</span> 
                                                    {item.title}
                                                    {item.categories.includes(FEATURED_TAG) && <span className="text-yellow-400 bg-yellow-400/20 px-1 rounded">[主編精選]</span>}
                                                </div>
                                                <div className="grid grid-cols-[80px_1fr] gap-2 items-start">
                                                    <span className="text-slate-500 text-right">原始輸入:</span>
                                                    <div className="break-all text-slate-400 bg-slate-800/50 p-1 rounded">{item.rawImage || "無 (空值)"}</div>
                                                    <span className="text-slate-500 text-right">轉換結果:</span>
                                                    <div className={`break-all p-1 rounded flex items-center gap-2 ${item.image ? 'text-emerald-300 bg-emerald-900/20' : 'text-red-300'}`}>
                                                        {item.image || "無有效連結"}
                                                        {item.image && item.image.includes('drive.google.com/uc') && (<span className="bg-emerald-800 text-emerald-100 text-[10px] px-1 rounded ml-auto whitespace-nowrap">Drive 轉換成功</span>)}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-amber-400">目前沒有讀取到任何資料，請檢查 Apps Script 網址是否正確。</div>
                                )}
                            </div>
                        )}
                    </footer>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
