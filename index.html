<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI x 教育 | 親子天下雙週報策展</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- 模組對應表 (Import Map) -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.263.1"
            }
        }
    </script>
    
    <!-- 引入 Babel (穩定版) -->
    <script src="https://unpkg.com/@babel/standalone@7.24.5/babel.min.js"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .text-shadow { text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .text-shadow-sm { text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        
        /* 內容依實際高度自然撐開，交由外層 iframe／頁面捲動，避免巢狀雙捲軸 */
        html, body {
            margin: 0; padding: 0;
            width: 100%;
            background-color: transparent;
        }

        #cw-ai-root {
            width: 100%;
            background-color: #f8fafc;
        }

        /* 強制隱藏第二個以後的所有重複結構 */
        body > div#cw-ai-root ~ div#cw-ai-root {
            display: none !important;
        }

        /* 窄寬度（手機/窄版 iframe）時垂直堆疊，避免擠壓；640px 以上才排成一行 */
        .fever-force-row {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
            width: 100%;
        }
        @media (min-width: 640px) {
            .fever-force-row {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }
        .fever-force-right {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        /* 強制卡片變為多欄 */
        .fever-force-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)) !important;
            gap: 24px !important;
        }
    </style>
</head>
<body>
    
    <!-- 唯一的掛載點 -->
    <div id="cw-ai-root">
        <div class="min-h-[850px] flex items-center justify-center text-slate-400">
            <div class="animate-pulse flex flex-col items-center">
                <div class="h-8 w-8 bg-slate-300 rounded-full mb-4"></div>
                <div class="text-sm font-medium">系統載入中...</div>
            </div>
        </div>
    </div>

    <!-- 主程式邏輯 -->
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Search, BookOpen, ExternalLink, Filter, Calendar, Tag, RefreshCw, 
            Layers, User, AlertCircle, Bug, CheckCircle, XCircle, Crown, 
            ArrowRight, Star, Mail, FileText, PenTool 
        } from 'lucide-react';

        // --- 分析追蹤 ---
        const trackEvent = (eventName, params) => {
            if (typeof window !== 'undefined' && typeof window.gtag === 'function') {
                window.gtag('event', eventName, params);
            }
        };

        // --- 設定區 ---
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxwao8aHQ3hCkxYj5MndNs6ObaPy4fphHr-WCdt-cCEK9uRpTaOomHJcTqNZKiMOxg7/exec";
        const HEADER_IMAGE_URL = ""; 
        const CACHE_KEY = "ai_curator_cache_v1";

        const COLUMN_MAPPING = {
            title: "Title", category1: "Category1", category2: "Category2", 
            summary: "Summary", link: "Link", image: "Image", date: "Date", author: "Author"      
        };

        const FEATURED_TAG = "主編精選";
        const SUBMISSION_TAG = "讀者投書";
        const PAGE_SIZE = 16; // 瀏覽全部時，每次「載入更多」的文章數
        const DEFAULT_VIEW_COUNT = 12; // 首頁預設（未選分類、未搜尋）只呈現的精選文章數

        const MOCK_DATA = [{
            id: 1, title: "AI 在 K-12 教育中的應用指南", categories: ["教學實務", "政策規範", "主編精選"], primaryCategories: ["教學實務"],
            summary: "目前讀取不到您的 Google Sheet 資料，這是一筆範例。",
            link: "#", date: "2024-01-15", image: null, author: "系統提示"
        }];

        // 骨架屏組件
        const SkeletonCard = () => (
            <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden h-full flex flex-col">
                <div className="h-44 bg-slate-200 animate-pulse"></div>
                <div className="p-5 flex flex-col gap-4 flex-grow">
                    <div className="h-7 bg-slate-200 rounded animate-pulse w-3/4"></div>
                    <div className="space-y-2 flex-grow">
                        <div className="h-4 bg-slate-200 rounded animate-pulse w-full"></div>
                        <div className="h-4 bg-slate-200 rounded animate-pulse w-full"></div>
                        <div className="h-4 bg-slate-200 rounded animate-pulse w-2/3"></div>
                    </div>
                </div>
            </div>
        );

        function App() {
            const [articles, setArticles] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState("");
            const [selectedCategory, setSelectedCategory] = useState("All");
            const [dataSource, setDataSource] = useState("mock");
            const [lastUpdated, setLastUpdated] = useState(null);
            const [heroIndex, setHeroIndex] = useState(0);
            const [visibleCount, setVisibleCount] = useState(PAGE_SIZE);
            const [browseAll, setBrowseAll] = useState(false);

            const processImageUrl = (url) => {
                if (!url) return null;
                let cleanUrl = String(url).trim();
                if (cleanUrl.includes('drive.google.com')) {
                    let id = null;
                    const parts = cleanUrl.match(/\/d\/(.*?)(?:\/|$)/);
                    if (parts && parts[1]) id = parts[1];
                    else {
                        try {
                            const urlObj = new URL(cleanUrl);
                            id = urlObj.searchParams.get("id");
                        } catch (e) {}
                    }
                    if (id) return `https://drive.google.com/uc?export=view&id=${id}`;
                }
                return cleanUrl;
            };

            const formatData = (data) => {
                 const seenTitles = new Set();

                 return data.map((item, index) => {
                        const title = item[COLUMN_MAPPING.title];
                        if (!title) return null;

                        const cleanTitle = title.trim();
                        if (seenTitles.has(cleanTitle)) return null; 
                        seenTitles.add(cleanTitle);
                        
                        let primaryList = [];
                        const cat1 = item[COLUMN_MAPPING.category1];
                        if (cat1) primaryList = String(cat1).split(/[,，]/).map(c => c.trim()).filter(c => c.length > 0);

                        let secondaryList = [];
                        const cat2 = item[COLUMN_MAPPING.category2];
                        if (cat2) secondaryList = String(cat2).split(/[,，]/).map(c => c.trim()).filter(c => c.length > 0);
                        
                        let fullList = [...new Set([...primaryList, ...secondaryList])];
                        if (fullList.length === 0) fullList = ["未分類"];

                        return {
                            id: index,
                            title: cleanTitle,
                            categories: fullList,
                            primaryCategories: primaryList,
                            summary: item[COLUMN_MAPPING.summary] || "",
                            link: item[COLUMN_MAPPING.link] || "#",
                            image: processImageUrl(item[COLUMN_MAPPING.image]),
                            date: item[COLUMN_MAPPING.date] ? String(item[COLUMN_MAPPING.date]) : "",
                            author: item[COLUMN_MAPPING.author] || ""
                        };
                    }).filter(item => item !== null);
            };

            const fetchData = async () => {
                try {
                    const cached = localStorage.getItem(CACHE_KEY);
                    if (cached) {
                        const { timestamp, data } = JSON.parse(cached);
                        setArticles(formatData(data));
                        setDataSource("cache");
                        setLastUpdated(new Date(timestamp).toLocaleTimeString());
                        setLoading(false);
                    }

                    const response = await fetch(APPS_SCRIPT_URL);
                    if (!response.ok) throw new Error("Network response was not ok");
                    const data = await response.json();
                    
                    if (Array.isArray(data)) {
                        setArticles(formatData(data));
                        setDataSource("api");
                        setLastUpdated(new Date().toLocaleTimeString());
                        localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: data }));
                    }
                } catch (err) {
                    console.error(err);
                    if (articles.length === 0) setArticles(formatData(MOCK_DATA));
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { fetchData(); }, []);

            const { featuredArticles, regularArticles } = useMemo(() => {
                const featured = [];
                const regular = [];
                articles.forEach(article => {
                    if (article.categories.includes(FEATURED_TAG)) featured.push(article);
                    else regular.push(article);
                });
                return { featuredArticles: featured, regularArticles: regular };
            }, [articles]);

            useEffect(() => {
                if (featuredArticles.length <= 1) return;
                const interval = setInterval(() => {
                    setHeroIndex((prev) => (prev + 1) % featuredArticles.length);
                }, 8000); 
                return () => clearInterval(interval);
            }, [featuredArticles]);

            const categories = useMemo(() => {
                if (loading && articles.length === 0) return ["All", "載入中..."];
                const primaryCats = articles.flatMap(a => a.primaryCategories);
                const uniqueCats = new Set(primaryCats);
                uniqueCats.delete(FEATURED_TAG);
                uniqueCats.add(SUBMISSION_TAG);
                return ["All", ...Array.from(uniqueCats).sort()];
            }, [articles, loading]);

            const filteredArticles = useMemo(() => {
                const sourceList = searchTerm ? articles : regularArticles;
                return sourceList.filter(article => {
                    const searchContent = (article.title + article.summary + article.categories.join(" ")).toLowerCase();
                    return searchContent.includes(searchTerm.toLowerCase()) && 
                        (selectedCategory === "All" || article.categories.includes(selectedCategory));
                });
            }, [articles, regularArticles, searchTerm, selectedCategory]);

            // 切換搜尋詞或分類時，重置顯示筆數
            useEffect(() => {
                setVisibleCount(PAGE_SIZE);
            }, [searchTerm, selectedCategory]);

            // 未搜尋、未選分類、也還沒點「瀏覽全部」時，只呈現一小批精選文章
            const isDefaultView = !searchTerm && selectedCategory === "All" && !browseAll;
            const displayedArticles = isDefaultView
                ? regularArticles.slice(0, DEFAULT_VIEW_COUNT)
                : filteredArticles.slice(0, visibleCount);
            const hasMoreDefault = isDefaultView && regularArticles.length > DEFAULT_VIEW_COUNT;
            const hasMoreBrowse = !isDefaultView && visibleCount < filteredArticles.length;

            const heroArticle = featuredArticles.length > 0 ? featuredArticles[heroIndex] : null;

            return (
                <div className="w-full bg-slate-50 font-sans text-slate-800 pb-10">
                    <header className="relative border-b border-indigo-900/10 shadow-lg sticky top-0 z-20 overflow-hidden">
                        <div className="absolute inset-0 bg-gradient-to-r from-[#2A2F75] via-[#6B4D9E] to-[#E56B8B]"></div>
                        <div className="absolute top-0 right-0 w-64 h-64 bg-white/10 blur-[60px] rounded-full pointer-events-none -translate-y-1/2 translate-x-1/2"></div>
                        <div className="absolute bottom-0 left-0 w-48 h-48 bg-blue-500/20 blur-[40px] rounded-full pointer-events-none translate-y-1/2 -translate-x-1/2"></div>
                        
                        <div className="relative z-10 max-w-6xl mx-auto px-4 py-4 fever-force-row">
                            
                            {/* 左側標題 */}
                            <div className="flex items-start gap-3 text-white">
                                <div className="hidden sm:flex flex-col items-center justify-center pt-1">
                                    <div className="text-3xl font-bold leading-none tracking-tighter">AI<span className="text-pink-300 mx-1">×</span>教育</div>
                                    <div className="w-full h-[1px] bg-white/30 mt-1 mb-1 transform -rotate-1"></div>
                                    <div className="text-[9px] tracking-widest opacity-80">BIWEEKLY</div>
                                </div>
                                <div className="flex-1">
                                    <h1 className="sm:hidden text-xl font-bold tracking-tight mb-1 flex items-center">
                                        AI<span className="text-pink-300 mx-1">×</span>教育
                                    </h1>
                                    <div className="flex flex-col gap-0.5">
                                        <p className="text-[13px] font-medium text-white/95 text-shadow">陪你看懂 AI 時代的教育與學習：</p>
                                        <p className="text-[13px] font-medium text-white/95 text-shadow">AI 改變了什麼？我們可以怎麼因應？</p>
                                    </div>
                                </div>
                            </div>
                            
                            {/* 右側：訂閱按鈕與搜尋列 */}
                            <div className="fever-force-right">
                                
                                {/* 訂閱按鈕縮小版 */}
                                <a 
                                    href="https://activity.parenting.com.tw/media_aieducationedm_wtledm_-2043"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    onClick={() => trackEvent('click_header_subscribe')}
                                    className="group relative flex items-center justify-center gap-1.5 bg-gradient-to-r from-pink-500 to-rose-400 hover:from-pink-400 hover:to-rose-300 text-white px-3 py-1.5 rounded-full font-bold shadow-lg shadow-pink-500/40 active:scale-95 transition-all overflow-hidden border border-white/20 whitespace-nowrap"
                                >
                                    <span className="absolute inset-0 w-full h-full bg-white/30 group-hover:translate-x-full -translate-x-full transition-transform duration-700 ease-in-out skew-x-12"></span>
                                    <Mail size={14} className="relative z-10" />
                                    <span className="relative z-10 text-xs tracking-wider">訂閱 AIx教育電子報</span>
                                </a>

                                {/* 搜尋與重新整理列縮小版 */}
                                <div className="flex items-center gap-1">
                                    <div className="relative group w-28 sm:w-36">
                                        <Search className="absolute left-2.5 top-1/2 -translate-y-1/2 text-white/60 group-hover:text-white transition-colors" size={14} />
                                        <input 
                                            type="text" 
                                            placeholder="搜尋文章..." 
                                            className="w-full pl-7 pr-2 py-1.5 bg-white/10 border border-white/20 rounded-full text-xs text-white placeholder-white/50 focus:bg-white/20 focus:border-white/40 focus:outline-none transition-all backdrop-blur-sm" 
                                            value={searchTerm} 
                                            onChange={(e) => setSearchTerm(e.target.value)} 
                                        />
                                    </div>
                                    <button 
                                        onClick={fetchData} 
                                        className="p-1.5 text-white/80 hover:text-white hover:bg-white/20 rounded-full transition-all border border-transparent hover:border-white/10" 
                                        title="重新整理資料"
                                    >
                                        <RefreshCw size={14} className={loading ? "animate-spin" : ""} />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-6">
                        {loading && articles.length === 0 ? (
                            <div className="fever-force-grid animate-fade-in">
                                {[1, 2, 3, 4, 5, 6].map((n) => <SkeletonCard key={n} />)}
                            </div>
                        ) : (
                            <div>
                                {!searchTerm && heroArticle && (
                                    <div className="mb-8 animate-fade-in">
                                        <div key={heroArticle.id} className="relative bg-[#2A2F75] rounded-3xl overflow-hidden shadow-2xl shadow-indigo-200 group transform transition-all animate-fade-in">
                                            <div className="absolute inset-0 bg-gradient-to-br from-[#2A2F75] to-[#4c2a75] z-0"></div>
                                            <div className="absolute top-0 right-0 w-[500px] h-[500px] bg-pink-500/20 blur-[100px] rounded-full pointer-events-none translate-x-1/3 -translate-y-1/3"></div>
                                            <div className="relative z-10 flex flex-col md:flex-row h-full">
                                                <div className="w-full md:w-[55%] relative h-48 md:h-80 overflow-hidden">
                                                    {heroArticle.image ? <img src={heroArticle.image} alt={heroArticle.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out" onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }} /> : null}
                                                    <div className={`w-full h-full absolute inset-0 bg-slate-800 flex items-center justify-center ${heroArticle.image ? 'hidden' : 'flex'}`}>
                                                        <Layers className="text-white/20" size={64} />
                                                    </div>
                                                    <div className="absolute inset-0 bg-gradient-to-t md:bg-gradient-to-r from-transparent via-[#2A2F75]/20 to-[#2A2F75] md:via-[#2A2F75]/50 md:to-[#2A2F75]"></div>
                                                </div>
                                                <div className="w-full md:w-[45%] p-5 md:p-8 flex flex-col justify-center text-white relative">
                                                    <div className="flex flex-wrap items-center gap-2 mb-2">
                                                        <span className="flex items-center gap-1 bg-yellow-400 text-[#2A2F75] px-2 py-0.5 rounded-full text-[10px] font-black tracking-wider shadow-lg"><Crown size={12} fill="currentColor" /> EDITOR'S CHOICE</span>
                                                        {heroArticle.categories.filter(c => c !== FEATURED_TAG).map(cat => <span key={cat} className="text-white/70 text-[10px] font-medium border border-white/20 px-2 py-0.5 rounded-full">{cat}</span>)}
                                                    </div>
                                                    <h2 className="text-lg md:text-3xl font-bold leading-tight mb-2 text-shadow-sm group-hover:text-pink-200 transition-colors">{heroArticle.title}</h2>
                                                    <p className="text-indigo-100/80 text-xs md:text-sm mb-4 line-clamp-2 md:line-clamp-3 leading-relaxed">{heroArticle.summary}</p>
                                                    <div className="mt-auto flex items-center justify-between border-t border-white/10 pt-3">
                                                        <div className="flex items-center gap-2">
                                                            {heroArticle.author && (<div className="flex items-center gap-2"><div className="w-6 h-6 rounded-full bg-white/10 flex items-center justify-center text-white"><User size={12} /></div><div className="flex flex-col"><span className="text-[10px] text-white/60">Author</span><span className="text-[10px] font-medium">{heroArticle.author}</span></div></div>)}
                                                        </div>
                                                        <a href={heroArticle.link} target="_blank" rel="noopener noreferrer" onClick={() => trackEvent('click_article_hero')} className="group/btn flex items-center gap-1.5 bg-white text-[#2A2F75] px-4 py-1.5 rounded-xl text-sm font-bold hover:bg-pink-50 active:scale-95 transition-all shadow-lg">
                                                            閱讀 <ArrowRight size={14} className="group-hover/btn:translate-x-1 transition-transform" />
                                                        </a>
                                                    </div>
                                                    
                                                    {featuredArticles.length > 1 && (
                                                        <div className="absolute bottom-3 right-5 flex gap-1.5">
                                                            {featuredArticles.map((_, idx) => (
                                                                <button 
                                                                    key={idx} 
                                                                    onClick={() => setHeroIndex(idx)} 
                                                                    className={`h-1.5 rounded-full transition-all duration-300 ${idx === heroIndex ? 'bg-white w-4' : 'bg-white/30 hover:bg-white/60 w-1.5'}`} 
                                                                    aria-label={`Go to slide ${idx + 1}`} 
                                                                />
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-3">
                                    <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                                        {categories.map(cat => (
                                            <button
                                                key={cat}
                                                onClick={() => { setSelectedCategory(cat); if (cat === "All") setBrowseAll(false); }}
                                                className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-all active:scale-95 ${selectedCategory === cat ? 'bg-gradient-to-r from-[#6B4D9E] to-[#C0568B] text-white shadow-md shadow-pink-200 border border-transparent' : 'bg-white text-slate-600 border border-slate-200 hover:border-pink-300 hover:text-[#C0568B]'}`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="fever-force-grid">
                                    {displayedArticles.map((article) => (
                                        <a key={article.id} href={article.link} target="_blank" rel="noopener noreferrer" onClick={() => trackEvent('click_article_card')} className="group bg-white rounded-2xl border border-slate-200 overflow-hidden hover:shadow-xl hover:shadow-purple-200/50 hover:-translate-y-1 active:scale-[0.98] transition-all duration-300 flex flex-col h-full">
                                            <div className="h-40 bg-slate-100 relative overflow-hidden group-hover:opacity-100">
                                                {article.image ? <img src={article.image} alt={article.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }} /> : null}
                                                <div className={`w-full h-full absolute top-0 left-0 bg-gradient-to-br from-slate-100 to-slate-200 flex flex-col items-center justify-center text-slate-400 ${article.image ? 'hidden' : 'flex'}`}>
                                                    <Layers className="mb-2" size={24} />
                                                    <span className="text-[10px] text-slate-300">無圖片</span>
                                                </div>
                                                <div className="absolute top-2 left-2 flex flex-wrap gap-1 max-w-[90%]">
                                                    {article.categories.filter(c => c !== FEATURED_TAG).map((cat, idx) => (
                                                        <span key={idx} className="px-2 py-0.5 bg-white/95 backdrop-blur-sm text-[10px] font-bold text-[#6B4D9E] rounded shadow-sm">{cat}</span>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="p-4 flex flex-col flex-grow">
                                                <h3 className="text-base font-bold text-slate-800 mb-2 line-clamp-2 leading-snug group-hover:text-[#C0568B] transition-colors">{article.title}</h3>
                                                <p className="text-slate-500 text-xs mb-3 line-clamp-2 flex-grow">{article.summary}</p>
                                                {article.author && <div className="flex items-center gap-1 text-[11px] text-slate-500 font-medium mb-3"><User size={10} className="text-slate-400" /><span>{article.author}</span></div>}
                                                <div className="pt-3 border-t border-slate-100 flex items-center justify-between mt-auto">
                                                    <div className="flex items-center gap-1 text-[11px] text-slate-400"><Calendar size={10} />{article.date ? article.date.substring(0, 10) : "近期更新"}</div>
                                                    <div className="flex items-center gap-1 text-[11px] font-bold text-[#6B4D9E] group-hover:underline">閱讀全文 <ExternalLink size={10} /></div>
                                                </div>
                                            </div>
                                        </a>
                                    ))}
                                </div>

                                {(hasMoreDefault || hasMoreBrowse) && (

                                            </button>
                                        )}
                                    </div>
                                )}
                            </div>

                    </main>

                    <section className="bg-slate-50 border-t border-slate-200 mt-6">

                                    <h4 className="font-bold text-slate-800 text-sm mb-1 group-hover:text-[#6B4D9E] transition-colors">預覽電子報</h4>
